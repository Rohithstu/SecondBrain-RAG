services:
  - type: web
    name: secondbrain-ai
    env: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: secondbrain-db
          property: connectionString

databases:
  - name: secondbrain-db
    plan: free
